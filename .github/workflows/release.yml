name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ⚠️ **发布前的测试门禁** ✗✗ —— 此前这个工作流唯一的检查是"tag 等于 Cargo.toml 的版本"，
  # 于是 tag 可以打在一个 CI 红的提交上，两个 musl 二进制照样发出去，而资产是不可变的。
  # notes 里写的"PR → CI 绿 → 合并 → tag → release"，那个"CI 绿"一直只是**人的约定**。
  #
  # 与 ci.yml 有重复，是有意的取舍：跨工作流无法 `needs:`，而 `workflow_run` 是异步的、
  # 不能可靠地当门禁。这段重复换来的是"发布不可能绕过测试"这条硬约束。
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # build.rs 会调它把主题物化到 target/theme；没有它连 cargo 都跑不起来。
      # ⚠️ 主题包从 GitHub Releases 下载。按 `web-theme.pin` 缓存：pin 一变缓存自然失效
      # （而且 `theme.sh` 自己也会校验 sha256 与关键文件）。没有它时每次 CI 都要多做一次
      # **与被测改动无关**的网络请求，网络抖一下就红。
      - uses: actions/cache@v4
        with:
          path: target/theme
          key: theme-${{ hashFiles('web-theme.pin') }}
      - run: ./scripts/theme.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-admin/package-lock.json
      # hub 内嵌面板：dist/ 必须在 cargo 之前就存在，否则编译出来的二进制服务的是旧面板。
      - run: npm ci && npm run build
        working-directory: web-admin
      - uses: dtolnay/rust-toolchain@stable
      # ⚠️ 没有缓存时 237 个 crate 每次从零编。
      - uses: Swatinem/rust-cache@v2
      # ⚠️ **shellcheck 也要在这里跑** ✗✗ —— 它此前只在 ci.yml 里。于是 1.12.10 的
      # install.sh 因为在 unit 的 heredoc 注释里用了反引号（那个 heredoc 的分隔符没有引号
      # ⇒ 反引号是**命令替换**）而让 ci 红了，但 release 自己的 check 只跑 fmt/clippy/test
      # ⇒ 版本照发，带着一个在安装时执行注释的脚本。
      - run: shellcheck install.sh install-hub.sh scripts/theme.sh scripts/e2e.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # `--locked`：与 build 阶段一致。不带它时，lock 漂移会在 CI 里被静默补好、只在
      # 发版时才暴露（v1.5.4 就是这么来的）。
      - run: cargo test --locked

  build:
    needs: check
    runs-on: ubuntu-latest
    # 没有上限时，一次网络挂起可以占满默认的 6 小时。
    timeout-minutes: 60
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v7

      # Checked before two cross builds rather than after: a v* tag cannot be
      # moved without rewriting what the releases already point at, and one that
      # disagrees with the manifest publishes binaries whose `--version` answers
      # something else.
      - if: startsWith(github.ref, 'refs/tags/')
        name: the tag matches the manifest
        run: |
          manifest=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          [ "$GITHUB_REF_NAME" = "v$manifest" ] ||
            { echo "::error::tag $GITHUB_REF_NAME, Cargo.toml $manifest"; exit 1; }

      # The default theme arrives as a published archive, verified against the
      # hash in web-theme.pin. Run on the runner rather than left to build.rs,
      # because the cross container below does not necessarily carry curl; it
      # finds the theme already unpacked.
      # ⚠️ 主题包从 GitHub Releases 下载。按 `web-theme.pin` 缓存：pin 一变缓存自然失效
      # （而且 `theme.sh` 自己也会校验 sha256 与关键文件）。没有它时每次 CI 都要多做一次
      # **与被测改动无关**的网络请求，网络抖一下就红。
      - uses: actions/cache@v4
        with:
          path: target/theme
          key: theme-${{ hashFiles('web-theme.pin') }}
      - run: ./scripts/theme.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-admin/package-lock.json

      # The hub embeds the panel, so its dist/ must exist before cargo runs.
      - run: npm ci && npm run build
        working-directory: web-admin

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: cargo install --locked cross
      - run: cross build --release --locked --target ${{ matrix.target }}

      - run: cp "target/${{ matrix.target }}/release/monitor-hub" "monitor-hub-${{ matrix.target }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: monitor-hub-${{ matrix.target }}

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      # The Dockerfile lives in the repo; the binaries it copies do not.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: bin
          merge-multiple: true
      # A manual dispatch builds and collects the binaries; only a tag publishes,
      # so the path can be exercised without cutting a release. gh ships on the
      # runner, keeping a third-party action out of the contents:write step.
      #
      # sha256sums.txt is generated from inside bin/ so the names in it are bare
      # asset names, which is what install-hub.sh matches before installing the
      # binary into /opt/monitor.
      #
      # install-hub.sh is published with the binaries and hashed alongside them:
      # re-running a copy saved on the machine is the documented upgrade path, and
      # that copy may be several releases old. The checksum entry is what lets it
      # recognise itself as stale and replace itself before rewriting the unit by
      # the rules it was written against. Published per release rather than read
      # from main, so the script a release was tested with is the one it is
      # measured against.
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          cp install-hub.sh bin/
          (cd bin && sha256sum monitor-hub-* install-hub.sh > sha256sums.txt)
          gh release create "$GITHUB_REF_NAME" bin/monitor-hub-* bin/install-hub.sh bin/sha256sums.txt \
            --generate-notes --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

      # The image carries the binary this release already published, so the two
      # cannot disagree on what a given tag contains. docker and buildx ship on
      # the runner, for the same reason gh does above.
      #
      # Both registries receive the same manifest from one build: Docker Hub is
      # where `docker run monitor` looks first, ghcr is what the repository
      # publishes alongside its binaries. A fork without the Docker Hub secrets
      # still gets its ghcr image rather than a failed release.
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          cp bin/monitor-hub-x86_64-unknown-linux-musl monitor-hub-amd64
          cp bin/monitor-hub-aarch64-unknown-linux-musl monitor-hub-arm64
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAGS="-t $IMAGE:$VERSION -t $IMAGE:latest"
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            # Same repository name as on GitHub, under the account the token belongs to.
            HUB="docker.io/$DOCKERHUB_USERNAME/${GITHUB_REPOSITORY##*/}"
            TAGS="$TAGS -t $HUB:$VERSION -t $HUB:latest"
          else
            echo "no Docker Hub credentials configured; publishing to ghcr only"
          fi
          # The default builder cannot produce two platforms in one manifest.
          docker buildx create --use --driver docker-container
          docker buildx build --platform linux/amd64,linux/arm64 --push $TAGS .
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
