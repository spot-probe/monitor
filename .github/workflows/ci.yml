name: ci

on:
  push:
    # The line this fork ships from. It read `[main, dev]` while main was a mirror of
    # upstream and dev carried our commits; the fork went solo, so main is the line
    # and dev is gone. PRs are built anyway, via the pull_request trigger below.
    # Prose changes nothing a compiler or linter can check.
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]

# A new push supersedes any run still in progress for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A hanging test would otherwise consume the six-hour default; a cold build
    # plus the suite takes a few minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The shell is how a machine is first reached, and it runs where a mistake
      # costs a node rather than a red test: the two installers and the theme
      # fetcher. shellcheck ships on the runner; all three are POSIX sh.
      - run: shellcheck install.sh install-hub.sh scripts/theme.sh

      # The version lives in the manifest and in the lock, and one of them was
      # forgotten once: v1.5.4 tagged a tree whose Cargo.lock still said 1.5.3, so
      # `cargo build --locked` from that tag failed. A lockfile that disagrees is
      # also what a hand-edit or a botched merge leaves behind, and it is cheaper
      # to catch here than in a release.
      - name: the version in Cargo.toml is the one in Cargo.lock
        run: |
          manifest=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          lock=$(sed -n '/^name = "monitor-hub"$/{n;s/^version = "\(.*\)"$/\1/p;q;}' Cargo.lock)
          echo "Cargo.toml $manifest · Cargo.lock $lock"
          [ -n "$manifest" ] && [ "$manifest" = "$lock" ] ||
            { echo "::error::Cargo.toml says '$manifest', Cargo.lock says '$lock'"; exit 1; }

      # The default theme arrives as a published archive, verified against the
      # hash in web-theme.pin. Run here rather than left to build.rs so the
      # download happens on the runner: release builds go through cross, whose
      # container does not necessarily carry curl.
      - run: ./scripts/theme.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-admin/package-lock.json

      # rust-embed requires the panel's dist/ to exist before cargo runs.
      - run: npm ci && npm run lint && npm test && npm run build
        working-directory: web-admin

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
