name: ci

on:
  # ⚠️ 手工触发：需要重跑一次 check 时（GitHub 抖动、或想验证一个 revert）
  # 不必再推一个空提交 —— notes 里已经记过『空提交测不出 push 触发』这个坑。
  workflow_dispatch:
  push:
    # The line this fork ships from. It read `[main, dev]` while main was a mirror of
    # upstream and dev carried our commits; the fork went solo, so main is the line
    # and dev is gone. PRs are built anyway, via the pull_request trigger below.
    # Prose changes nothing a compiler or linter can check.
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]

# A new push supersedes any run still in progress for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A hanging test would otherwise consume the six-hour default; a cold build
    # plus the suite takes a few minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The shell is how a machine is first reached, and it runs where a mistake
      # costs a node rather than a red test: the two installers and the theme
      # fetcher. shellcheck ships on the runner; all three are POSIX sh.
      - run: shellcheck install.sh install-hub.sh scripts/theme.sh scripts/e2e.sh

      # The version lives in the manifest and in the lock, and one of them was
      # forgotten once: v1.5.4 tagged a tree whose Cargo.lock still said 1.5.3, so
      # `cargo build --locked` from that tag failed. A lockfile that disagrees is
      # also what a hand-edit or a botched merge leaves behind, and it is cheaper
      # to catch here than in a release.
      - name: the version in Cargo.toml is the one in Cargo.lock
        run: |
          manifest=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          lock=$(sed -n '/^name = "monitor-hub"$/{n;s/^version = "\(.*\)"$/\1/p;q;}' Cargo.lock)
          echo "Cargo.toml $manifest · Cargo.lock $lock"
          [ -n "$manifest" ] && [ "$manifest" = "$lock" ] ||
            { echo "::error::Cargo.toml says '$manifest', Cargo.lock says '$lock'"; exit 1; }

      # The default theme arrives as a published archive, verified against the
      # hash in web-theme.pin. Run here rather than left to build.rs so the
      # download happens on the runner: release builds go through cross, whose
      # container does not necessarily carry curl.
      # ⚠️ 主题包从 GitHub Releases 下载。按 `web-theme.pin` 缓存：pin 一变缓存自然失效
      # （而且 `theme.sh` 自己也会校验 sha256 与关键文件）。没有它时每次 CI 都要多做一次
      # **与被测改动无关**的网络请求，网络抖一下就红。
      - uses: actions/cache@v4
        with:
          path: target/theme
          key: theme-${{ hashFiles('web-theme.pin') }}
      - run: ./scripts/theme.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-admin/package-lock.json

      # rust-embed requires the panel's dist/ to exist before cargo runs.
      - run: npm ci && npm run lint && npm test && npm run build
        working-directory: web-admin

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # ⚠️ Rust 构建缓存：237 个 crate（含 bundled SQLite）没有缓存时每次从零编。
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # `--locked`：release 阶段用 `cross build --release --locked`。这里不带的话，往
      # Cargo.toml 加依赖却忘了 Cargo.lock 时，CI 会在 runner 上**静默把 lock 补好**并通过，
      # 而发版时才失败（v1.5.4 就是这么来的）。
      - run: cargo test --locked

      # ⚠️ **跨仓契约的另一半** ✗✗ —— `scripts/e2e.sh` 把「这个 hub」与「最新发布的 agent」
      # 配起来跑：建一台节点、让 agent 报进来、两边各看一遍。此前只有 agent 的 CI 跑它，
      # 而且对的是**已发布**的 hub ⇒ 「新 hub × 新 agent」这个组合**没有任何人跑**。改了
      # agent 上报契约（字段白名单、`save_facts`）时，唯一能发现破坏的地方原本不在这个仓。
      - run: cargo build --locked
      - name: pair this hub with the latest released agent
        run: |
          curl -fsSL -o monitor-agent \
            https://github.com/spot-probe/agent/releases/latest/download/monitor-agent-x86_64-unknown-linux-musl
          chmod +x monitor-agent
          ./scripts/e2e.sh "$PWD/target/debug/monitor-hub" "$PWD/monitor-agent"


      # Behaviour and **real layout**, on the running hub. jsdom cannot see either one:
      # it has no layout engine (every box is 0x0), and "the dialog closed" is a fact
      # about the rendered DOM. Two bugs shipped this month that only the rendered page
      # could show, so the suite runs against a real server rather than a fake DOM.
      #
      # The panel's dist/ is already built above: the debug hub serves it from disk.
      - run: npx playwright install --with-deps chromium
        working-directory: web-admin

      # A throwaway database, so the suite never depends on anyone's data, and the
      # password is read from the hub's own first-run output -- no secret to keep in
      # sync with a fixture.
      - name: start a hub on a throwaway database
        run: |
          cargo build
          mkdir -p "$RUNNER_TEMP/e2e-themes"
          ./target/debug/monitor-hub --listen 127.0.0.1:28190 \
            --db "$RUNNER_TEMP/e2e.db" --themes "$RUNNER_TEMP/e2e-themes" \
            > "$RUNNER_TEMP/hub.log" 2>&1 &
          for _ in $(seq 1 40); do
            grep -q 'Emergency password:' "$RUNNER_TEMP/hub.log" && break
            sleep 0.5
          done
          grep -q 'Emergency password:' "$RUNNER_TEMP/hub.log" ||
            { echo '::error::the hub did not start'; cat "$RUNNER_TEMP/hub.log"; exit 1; }
          echo "PW_PASSWORD=$(sed -n 's/.*Emergency password: //p' "$RUNNER_TEMP/hub.log" | head -n 1)" >> "$GITHUB_ENV"
          curl -sf -o /dev/null http://127.0.0.1:28190/admin/ ||
            { echo '::error::the panel is not answering'; exit 1; }

      - run: npx playwright test
        working-directory: web-admin

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web-admin/test-results
            web-admin/playwright-report
          retention-days: 7
